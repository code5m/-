name: Tibo Reset Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tibo-reset-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run tests
        run: npm test

      - name: Monitor Tibo and notify WeChat
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          WXPUSHER_APP_TOKEN: ${{ secrets.WXPUSHER_APP_TOKEN }}
          WXPUSHER_UIDS: ${{ secrets.WXPUSHER_UIDS }}
          TIBO_RESET_FEED_URL: ${{ vars.TIBO_RESET_FEED_URL }}
          BOOTSTRAP_NOTIFY_LATEST: "true"
          BOOTSTRAP_MAX_AGE_HOURS: "24"
          ALERT_ON_HINTS: "false"
        run: npm run monitor

      - name: Persist deduplication state
        run: |
          if git diff --quiet -- state/notified.json; then
            echo "No state change."
            exit 0
          fi
          git config user.name "tibo-reset-bot"
          git config user.email "tibo-reset-bot@users.noreply.github.com"
          git add state/notified.json
          git commit -m "chore: persist tibo monitor state"
          git push
